# Development settings for bento.
#
# niri has no .cargo/config.toml, so keeping these here rather than in Cargo.toml avoids conflicts
# when merging upstream.

# The everyday build, `cargo build` and `cargo test`: optimized like a release, so bento runs as
# it will, but without LTO and with many codegen units and incremental builds, so a rebuild after
# a small change takes seconds. Without debug info, it stays small on disk: panics still name
# their functions. A build with debug info is for a debugging session, and goes away after it:
#
#     cargo build --profile debugging
#     cargo clean --profile debugging
#
# Release builds, with `--release`, are for installing bento for good.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = true
codegen-units = 256
incremental = true

[profile.debugging]
inherits = "dev"
debug = "line-tables-only"

[alias]
# Build and run bento nested in a window inside the current session.
# Arguments go to bento, e.g. `cargo nested -c path/to/config.kdl`. When nested, Mod is Alt.
nested = "run --"
