name: Sync with niri

# Weekly merge of niri-wm/niri main into bento. A clean merge is opened as a PR
# from the sync/niri branch; a conflicting merge opens (or updates) an issue.
# This only ever fetches from niri; nothing is pushed there.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: niri-sync
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPSTREAM_URL: https://github.com/niri-wm/niri.git
  SYNC_BRANCH: sync/niri
  LABEL: niri-sync

jobs:
  sync:
    if: github.repository == 'faetalize/bento'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Fetch niri
        run: |
          git remote add niri "$UPSTREAM_URL"
          git remote set-url --push niri no_push
          git fetch --no-tags niri main:refs/remotes/niri/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh label create "$LABEL" --color 5319e7 --description 'Automated niri upstream sync' --force

      - name: Merge niri main
        id: merge
        run: |
          upstream=$(git rev-parse niri/main)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

          # Build on top of an open sync PR so fixes pushed to it are kept.
          pr=$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            git fetch origin "$SYNC_BRANCH"
            git checkout -B "$SYNC_BRANCH" FETCH_HEAD
          else
            git checkout -B "$SYNC_BRANCH" origin/main
          fi

          if git merge-base --is-ancestor niri/main HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit -m "Merge niri-wm/niri main (${upstream:0:12})" niri/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync PR
        id: pr
        if: steps.merge.outputs.status == 'clean'
        env:
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          PR: ${{ steps.merge.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            push_args=()
          else
            push_args=(--force)
          fi
          if ! git push "${push_args[@]}" origin "$SYNC_BRANCH" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log"
            # GITHUB_TOKEN can't push commits that touch .github/workflows.
            echo "status=push-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PR" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" --label "$LABEL" \
              --title "Sync with niri-wm/niri main" \
              --body "Automated merge of [niri-wm/niri@${UPSTREAM:0:12}](https://github.com/niri-wm/niri/commit/$UPSTREAM) into bento. The merge was clean; check CI before merging."
          fi

          # Pushes made with GITHUB_TOKEN don't trigger workflows, but dispatches do.
          gh workflow run ci.yml --ref "$SYNC_BRANCH"

          # A clean merge resolves any earlier conflict report.
          for issue in $(gh issue list --label "$LABEL" --state open --json number -q '.[].number'); do
            gh issue close "$issue" --comment "niri main merged cleanly at niri-wm/niri@${UPSTREAM:0:12}; see the sync PR."
          done

      - name: Report merge problems
        if: steps.merge.outputs.status == 'conflict' || steps.pr.outputs.status == 'push-failed'
        env:
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
          STATUS: ${{ steps.merge.outputs.status == 'conflict' && 'conflict' || 'push-failed' }}
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "The weekly sync with [niri-wm/niri@${UPSTREAM:0:12}](https://github.com/niri-wm/niri/commit/$UPSTREAM) needs a manual merge."
            echo
            if [ "$STATUS" = conflict ]; then
              echo "Conflicting files:"
              echo
              sed 's/.*/- `&`/' "$RUNNER_TEMP/conflicts.txt"
            else
              echo "The merge was clean, but the workflow token can't push it (usually because niri changed files under \`.github/workflows\`)."
            fi
            echo
            echo '```sh'
            echo 'git fetch niri'
            echo 'git merge niri/main'
            echo '```'
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$body"

          issue=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --label "$LABEL" --title "niri sync needs a manual merge" --body-file "$body"
          fi
